name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint JS and CSS
        run: npm run lint

      - name: Build blocks
        run: npm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install PHP dev dependencies
        working-directory: plugins/pura-capoeira-core
        run: composer install --no-interaction --prefer-dist

      - name: PHPCS
        working-directory: plugins/pura-capoeira-core
        run: composer run lint

      - name: PHPUnit
        working-directory: plugins/pura-capoeira-core
        run: composer run test:unit
