name: Deploy WordPress theme and plugin

# Push to master → build, lint, test, then rsync the theme and plugin into the live
# WordPress install (secrets.DEPLOY_PATH, the same docroot the static site used).
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test, deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build blocks
        run: npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install PHP dev dependencies
        working-directory: plugins/pura-capoeira-core
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP (WordPress coding standards)
        working-directory: plugins/pura-capoeira-core
        run: composer run lint

      - name: Unit tests
        working-directory: plugins/pura-capoeira-core
        run: composer run test:unit

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Check the target is a WordPress install
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "test -f '${{ secrets.DEPLOY_PATH }}/wp-config.php' && test -d '${{ secrets.DEPLOY_PATH }}/wp-content' \
             || { echo 'DEPLOY_PATH does not contain a WordPress install (no wp-config.php / wp-content)'; exit 1; }"

      - name: Deploy theme
        run: |
          rsync -az --delete \
            --exclude='node_modules/' --exclude='src/' --exclude='package*.json' \
            --exclude='.wp-env*' --exclude='*.md' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p ${{ secrets.SSH_PORT }}" \
            themes/pura-capoeira/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/wp-content/themes/pura-capoeira/"

      - name: Deploy plugin
        run: |
          rsync -az --delete \
            --exclude='node_modules/' --exclude='src/' --exclude='package*.json' \
            --exclude='vendor/' --exclude='composer.*' --exclude='phpunit.xml.dist' --exclude='phpcs.xml.dist' \
            --exclude='tests/unit/' --exclude='.phpunit.cache/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p ${{ secrets.SSH_PORT }}" \
            plugins/pura-capoeira-core/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/wp-content/plugins/pura-capoeira-core/"

      - name: Fix ownership and permissions
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "for d in '${{ secrets.DEPLOY_PATH }}/wp-content/themes/pura-capoeira' '${{ secrets.DEPLOY_PATH }}/wp-content/plugins/pura-capoeira-core'; do \
               chown -R capoeiracuernava:capoeiracuernava \"\$d\" && \
               find \"\$d\" -type d -exec chmod 755 {} \; && \
               find \"\$d\" -type f -exec chmod 644 {} \; ; done"

      - name: Activate and flush (only if WP-CLI is installed on the server)
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "if command -v wp >/dev/null 2>&1; then \
               sudo -u capoeiracuernava -i -- wp --path='${{ secrets.DEPLOY_PATH }}' plugin activate pura-capoeira-core && \
               sudo -u capoeiracuernava -i -- wp --path='${{ secrets.DEPLOY_PATH }}' theme activate pura-capoeira && \
               sudo -u capoeiracuernava -i -- wp --path='${{ secrets.DEPLOY_PATH }}' cache flush && \
               sudo -u capoeiracuernava -i -- wp --path='${{ secrets.DEPLOY_PATH }}' rewrite flush --hard; \
             else echo 'wp-cli not found on the server; skipping activate/flush (files are deployed).'; fi"

      - name: Clear cPanel NGINX cache
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "/usr/local/cpanel/scripts/ea-nginx clear_cache capoeiracuernava && /usr/local/cpanel/scripts/ea-nginx reload"
