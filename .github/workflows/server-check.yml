name: Server check

# Manual, read-only inspection of the VPS with the deploy credentials: WordPress and plugin
# health (`wp pura doctor`), how outgoing mail is configured (FluentSMTP, Exim), and the DNS
# records that decide whether that mail is accepted (MX, SPF, DKIM). Nothing is changed.
on:
  workflow_dispatch:

jobs:
  check:
    name: Inspect the server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Inspect
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set +e; W='${{ secrets.DEPLOY_PATH }}'; U=capoeiracuernava; \
             run() { su -s /bin/bash \"\$U\" -c \"wp --path='\$W' \$*\" 2>&1; }; \
             echo '== host'; whoami; hostname; php -v | head -1; \
             echo '== cPanel accounts and their sites'; for u in \$(ls /var/cpanel/users); do d=\$(grep -E '^DNS=' /var/cpanel/users/\$u | cut -d= -f2); r=/home/\$u/public_html; t=other; [ -f \$r/wp-config.php ] && t=wordpress; [ -f \$r/index.html ] && [ \$t = other ] && t=static; echo \"  \$u  \$d  \$t  \$(ls \$r 2>/dev/null | head -c 120 | tr '\\n' ' ')\"; done; \
             echo '== wp core'; run core version; run option get siteurl; \
             echo '== plugins'; run plugin list --fields=name,status,version; \
             echo '== pura doctor'; run pura doctor; \
             echo '== content migrations applied'; run option get pura_content_migrations --format=json; echo; \
             echo '== confirmation pages'; run post list --post_type=page --name=gracias-clase-de-prueba --fields=ID,post_name,post_status,post_date; \
             echo '== FluentSMTP settings (passwords masked)'; \
             run option get fluentmail-settings --format=json 2>/dev/null \
               | sed -E 's/\"(password|secret_key|access_key|api_key|client_secret|auth_token|access_token|refresh_token)\":\"[^\"]*\"/\"\\1\":\"***\"/g' | head -c 4000; echo; \
             echo '== FluentSMTP recent log (last 10)'; \
             run db query \"'SELECT id, status, created_at, subject FROM wp_fsmpt_email_logs ORDER BY id DESC LIMIT 10'\" 2>&1 | head -20; \
             echo '== wp_mail test (to notify_emails via FluentSMTP if active)'; \
             printf '%s' '<?php echo wp_mail(\"codecharmer@codecharmer.io\", \"Server check \" . gmdate(\"c\"), \"Prueba de wp_mail desde el VPS.\") ? \"wp_mail: true\" : \"wp_mail: false\";' > /tmp/pura-mail-probe.php; chmod 644 /tmp/pura-mail-probe.php; \
             run eval-file /tmp/pura-mail-probe.php; rm -f /tmp/pura-mail-probe.php; \
             echo '== Exim / sendmail'; which sendmail exim 2>/dev/null; systemctl is-active exim 2>/dev/null; \
             echo '== mail accounts for the domain'; ls /home/\$U/mail/capoeiracuernavaca.com 2>/dev/null; \
             echo '== DNS'; for t in MX TXT; do echo \"-- \$t capoeiracuernavaca.com\"; dig +short \$t capoeiracuernavaca.com; done; \
             echo '-- DKIM default._domainkey'; dig +short TXT default._domainkey.capoeiracuernavaca.com | head -c 300; echo; \
             echo '== PHP mail settings'; php -i 2>/dev/null | grep -i -E '^sendmail_path|^SMTP ' ; \
             echo '== done'"
