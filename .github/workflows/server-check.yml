name: Server check

# Manual, read-only inspection of the VPS with the deploy credentials: WordPress and plugin
# health (`wp pura doctor`), how outgoing mail is configured (FluentSMTP, Exim), and the DNS
# records that decide whether that mail is accepted (MX, SPF, DKIM). Nothing is changed.
on:
  workflow_dispatch:

jobs:
  check:
    name: Inspect the server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Inspect
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set +e; W='${{ secrets.DEPLOY_PATH }}'; U=capoeiracuernava; \
             run() { sudo -u \"\$U\" -i -- wp --path=\"\$W\" \"\$@\" 2>&1; }; \
             echo '== host'; whoami; hostname; php -v | head -1; \
             echo '== wp core'; run core version; run option get siteurl; \
             echo '== plugins'; run plugin list --fields=name,status,version; \
             echo '== pura doctor'; run pura doctor; \
             echo '== FluentSMTP settings (passwords masked)'; \
             run option get fluent_mail_settings --format=json 2>/dev/null \
               | sed -E 's/\"(password|pass|secret|api_key|access_key|secret_key)\":\"[^\"]*\"/\"\\1\":\"***\"/g' | head -c 4000; echo; \
             echo '== FluentSMTP recent log (last 10)'; \
             run db query 'SELECT id, status, created_at, subject FROM wp_fluentmail_email_logs ORDER BY id DESC LIMIT 10' 2>&1 | head -20; \
             echo '== wp_mail test (to notify_emails via FluentSMTP if active)'; \
             run eval 'echo wp_mail(\"${{ secrets.MAIL_TEST_TO }}\", \"Server check \" . gmdate(\"c\"), \"Prueba de wp_mail desde el VPS.\") ? \"wp_mail: true\" : \"wp_mail: false\";' 2>&1; \
             echo '== Exim / sendmail'; which sendmail exim 2>/dev/null; systemctl is-active exim 2>/dev/null; \
             echo '== mail accounts for the domain'; ls /home/\$U/mail/capoeiracuernavaca.com 2>/dev/null; \
             echo '== DNS'; for t in MX TXT; do echo \"-- \$t capoeiracuernavaca.com\"; dig +short \$t capoeiracuernavaca.com; done; \
             echo '-- DKIM default._domainkey'; dig +short TXT default._domainkey.capoeiracuernavaca.com | head -c 300; echo; \
             echo '== PHP mail settings'; php -i 2>/dev/null | grep -i -E '^sendmail_path|^SMTP ' ; \
             echo '== done'"
